{% extends "inventory/base.html" %}

{% block title %}
Delete Supplier
{% endblock %}

{% block content %}

<h1>Delete Supplier</h1>

<p>
    Are you sure you want to delete
    <strong>{{ supplier.name }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button
        type="submit"
        class="danger"
    >
        Yes, Delete
    </button>

    <a
        class="button"
        href="{% url 'supplier_list' %}"
    >
        Cancel
    </a>

</form>

{% endblock %}
